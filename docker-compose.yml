version: '3.8'

services:
  pizalearn:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pizalearn-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ADMIN_PIN=${ADMIN_PIN:-000000}
    volumes:
      # Persistent local storage for SQLite/JSON database and photos
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
